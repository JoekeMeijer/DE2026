volumes:
  data:
    driver_opts:
      type: none
      device: /home/${USER_HOME}/data
      o: bind
  kafka-data:
    driver_opts:
      type: none
      device: /home/${USER_HOME}/kafka_data
      o: bind
  notebooks:
    driver_opts:
      type: none
      device: /home/${USER_HOME}/notebooks
      o: bind
  checkpoint:
    driver_opts:
      type: none
      device: /home/${USER_HOME}/checkpoint
      o: bind
services:
  spark-driver-app:
    build:
      context: ./jupyter-all-spark-notebook-gcp    # jupyter/all-spark-notebook with spark configurations for bigquery and gcs
    container_name: spark-driver-app
    ports:
      - "8888:8888"
      - "4040-4050:4040-4050"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - notebooks:/home/jovyan/notebooks  # jovyan is the default user of the image all-spark-notebook:spark-3.1.2. Do not change this
      - data:/home/jovyan/data
      - checkpoint:/home/jovyan/checkpoint
    depends_on:
      - spark-master
      - kafka
  spark-master:
    build:
      context: ./apache-spark-python3.13    # spark matching the python version of Jupyter lab
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
      - SPARK_DAEMON_MEMORY=2G
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - data:/home/jovyan/data
      - checkpoint:/home/jovyan/checkpoint
  spark-worker-1:
    build:
      context: ./apache-spark-python3.13    # spark matching the python version of Jupyter lab
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 1 --memory 2G --webui-port 8081 spark://spark-master:7077 
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    volumes:
      - data:/home/jovyan/data
      - checkpoint:/home/jovyan/checkpoint
  spark-worker-2:
    build:
      context: ./apache-spark-python3.13    # spark matching the python version of Jupyter lab
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 1 --memory 2G --webui-port 8081 spark://spark-master:7077 
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8082:8081"
    volumes:
      - data:/home/jovyan/data
      - checkpoint:/home/jovyan/checkpoint
 # --- APACHE KAFKA 4.4.0 (KRaft Mode) ---
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: INTERNAL for Spark containers, EXTERNAL for your laptop
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${EXTERNAL_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L62xdwCQKWvZs96M7NM7Q' # Pre-generated cluster ID for KRaft setup
    volumes:
      - kafka-data:/var/lib/kafka/data
